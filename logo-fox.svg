<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a12"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#darkGrad)" stroke="url(#orangeGrad)" stroke-width="4"/>

  <!-- Fennec Fox body -->
  <ellipse cx="256" cy="300" rx="80" ry="60" fill="#d49a5a"/>

  <!-- Fennec Fox head -->
  <ellipse cx="256" cy="230" rx="55" ry="50" fill="#e8b86d"/>

  <!-- Left ear - big characteristic fennec ear -->
  <polygon points="210,195 190,80 230,185" fill="#e8b86d"/>
  <polygon points="215,190 200,100 230,185" fill="#f5d5a0"/>

  <!-- Right ear - big characteristic fennec ear -->
  <polygon points="302,195 322,80 282,185" fill="#e8b86d"/>
  <polygon points="297,190 312,100 282,185" fill="#f5d5a0"/>

  <!-- Eyes -->
  <ellipse cx="235" cy="225" rx="8" ry="10" fill="#1a1a2e"/>
  <ellipse cx="277" cy="225" rx="8" ry="10" fill="#1a1a2e"/>
  <ellipse cx="237" cy="223" rx="3" ry="4" fill="#f97316"/>
  <ellipse cx="279" cy="223" rx="3" ry="4" fill="#f97316"/>

  <!-- Nose -->
  <ellipse cx="256" cy="245" rx="6" ry="4" fill="#1a1a2e"/>

  <!-- Code brackets on sides -->
  <text x="170" y="260" font-family="monospace" font-size="40" font-weight="bold" fill="url(#orangeGrad)">&lt;</text>
  <text x="330" y="260" font-family="monospace" font-size="40" font-weight="bold" fill="url(#orangeGrad)">/&gt;</text>

  <!-- Code dot in middle -->
  <circle cx="256" cy="255" r="4" fill="#f97316"/>

  <!-- Text -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#d1d5e0" text-anchor="middle" letter-spacing="-1">JometCode</text>
  <text x="256" y="408" font-family="monospace" font-size="13" fill="#5a5f7a" text-anchor="middle" letter-spacing="1">PYTHON SANDBOX</text>
</svg>
